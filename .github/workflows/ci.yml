name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Project and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check generated project and permissions
        run: python3 scripts/check-source.py
      - name: Check shell syntax
        run: bash -n scripts/check-native.sh
      - name: Check workflow syntax
        # actionlint 1.7.12 predates GitHub's documented Xcode 27 preview runner label.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -ignore 'label "xcode-27" is unknown' .github/workflows/ci.yml .github/workflows/deploy-signaling.yml

  signaling:
    name: Signaling tests and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, test, and build
        run: bun run check
      - name: Validate Cloudflare deployment package
        run: bun run check:deploy
      - name: Upload Worker deployment package
        uses: actions/upload-artifact@v4
        with:
          name: scrnshr-worker
          path: signaling/.cloudflare/output/v0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native ${{ matrix.platform }} compile and XCTest
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [phone, mac]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: native-spm-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('Scrnshr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build selected platform and run tests
        run: bash scripts/check-native.sh --${{ matrix.platform }}
      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-test-results
          path: .build/native-test-results.*/*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Package unsigned Mac receiver
        if: matrix.platform == 'mac'
        run: ditto -c -k --sequesterRsrc --keepParent .build/DerivedData/Build/Products/Release/ScrnshrMac.app .build/scrnshr-mac-unsigned.zip
      - name: Upload unsigned Mac receiver
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: scrnshr-mac-unsigned
          path: .build/scrnshr-mac-unsigned.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
